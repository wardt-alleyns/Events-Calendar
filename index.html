<style>
  :root{
    --navy:#2B3A8F;
    --navy-dark:#1a2460;
    --navy-mid:#3a4fa8;
    --navy-light:#eef0fa;
    --bg:#f2f3f8;
    --amber:#c77d09;
    --amber-bg:#fdf3e1;
    --green:#1f7a4d;
    --green-bg:#e6f4ec;
    --red:#b3261e;
    --red-bg:#fbeae9;
    --ink:#1d2330;
    --muted:#5b6376;
    --line:#d7dbeb;
    --line-soft:#e7e9f4;
    --font:'Futura PT','Century Gothic',Futura,'Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    font-size:16px;
  }

  /* ---------- HEADER ---------- */
  header.site{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 70%,var(--navy-mid) 100%);
    color:#fff;
    box-shadow:0 2px 12px rgba(20,30,80,.25);
  }
  .site-inner{
    max-width:1080px;margin:0 auto;
    padding:18px 22px;
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .wordmark{
    font-size:1.85rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.18em;
    white-space:nowrap;line-height:1;
  }
  .divider{
    width:1px;align-self:stretch;min-height:34px;
    background:rgba(255,255,255,.35);
  }
  .meta{display:flex;flex-direction:column;gap:1px;}
  .meta .wk{font-weight:700;letter-spacing:.04em;font-size:1.02rem;}
  .meta .rng{font-size:.92rem;color:rgba(255,255,255,.85);}
  .meta .iu{
    font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;
    color:rgba(255,255,255,.6);margin-top:2px;
  }

  /* ---------- DAY NAV ---------- */
  nav.days{
    position:sticky;top:0;z-index:40;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 1px 6px rgba(20,30,80,.06);
  }
  .days-inner{
    max-width:1080px;margin:0 auto;
    display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .days-inner::-webkit-scrollbar{display:none;}
  .daytab{
    flex:1 0 auto;min-width:78px;
    border:none;background:none;cursor:pointer;
    padding:9px 12px 8px;
    font-family:var(--font);color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:1px;
    border-bottom:3px solid transparent;
    transition:background .12s,color .12s,border-color .12s;
  }
  .daytab:hover{background:var(--navy-light);}
  .daytab .dn{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;}
  .daytab .dd{font-size:1.32rem;font-weight:700;line-height:1.05;color:var(--ink);}
  .daytab .dc{
    font-size:.66rem;background:var(--line-soft);color:var(--muted);
    padding:1px 7px;border-radius:9px;margin-top:2px;font-weight:600;
  }
  .daytab.active{border-bottom-color:var(--navy);background:var(--navy-light);}
  .daytab.active .dn{color:var(--navy);}
  .daytab.active .dd{color:var(--navy-dark);}
  .daytab.active .dc{background:var(--navy);color:#fff;}
  .daytab:focus-visible{outline:2px solid var(--navy-mid);outline-offset:-2px;}

  /* ---------- LAYOUT ---------- */
  main{max-width:1080px;margin:0 auto;padding:18px 16px 40px;}
  .day-head{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin:6px 2px 14px;
  }
  .day-head h2{margin:0;font-size:1.3rem;color:var(--navy-dark);letter-spacing:.01em;}
  .day-head .sub{color:var(--muted);font-size:.9rem;}

  /* ---------- CARD ---------- */
  .card{
    background:#fff;border:1px solid var(--line);
    border-radius:11px;margin-bottom:11px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,80,.05);
  }
  .card.open{border-color:var(--navy-mid);box-shadow:0 4px 16px rgba(20,30,80,.12);}
  .card-head{
    width:100%;text-align:left;border:none;background:none;cursor:pointer;
    font-family:var(--font);
    display:flex;align-items:flex-start;gap:13px;
    padding:13px 15px;
  }
  .card-head:hover{background:#fafbff;}
  .card-head:focus-visible{outline:2px solid var(--navy-mid);outline-offset:-2px;}
  .timepill{
    flex:0 0 auto;
    background:var(--navy);color:#fff;
    font-size:.74rem;font-weight:600;letter-spacing:.02em;
    padding:5px 9px;border-radius:7px;white-space:nowrap;
    text-align:center;line-height:1.25;min-width:62px;
  }
  .timepill small{display:block;font-size:.62rem;opacity:.8;font-weight:500;}
  .ch-main{flex:1 1 auto;min-width:0;}
  .ch-title{font-weight:700;font-size:1.02rem;color:var(--ink);line-height:1.25;}
  .ch-sub{
    font-size:.82rem;color:var(--muted);margin-top:3px;
    display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;
  }
  .ch-sub .mgr::before{content:"";}
  .ch-type{
    font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--navy-mid);font-weight:600;
  }
  .badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .badge{
    font-size:.66rem;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:2px 8px;border-radius:20px;
    border:1px solid transparent;
  }
  .b-cat{background:var(--amber-bg);color:var(--amber);border-color:#eccf9d;}
  .b-est{background:var(--navy-light);color:var(--navy);border-color:#cdd4f1;}
  .b-av{background:var(--green-bg);color:var(--green);border-color:#bcdcc9;}
  .b-note{background:var(--red-bg);color:var(--red);border-color:#eec4c1;}
  .chev{
    flex:0 0 auto;align-self:center;color:var(--navy-mid);
    transition:transform .18s;font-size:1rem;
  }
  .card.open .chev{transform:rotate(180deg);}

  /* ---------- BODY / TABS ---------- */
  .card-body{display:none;border-top:1px solid var(--line-soft);}
  .card.open .card-body{display:block;}
  .tabstrip{
    display:flex;overflow-x:auto;scrollbar-width:none;
    background:#fafbff;border-bottom:1px solid var(--line-soft);
  }
  .tabstrip::-webkit-scrollbar{display:none;}
  .tabbtn{
    flex:0 0 auto;border:none;background:none;cursor:pointer;
    font-family:var(--font);font-size:.82rem;font-weight:600;
    color:var(--muted);padding:10px 14px;
    border-bottom:2px solid transparent;white-space:nowrap;
    transition:color .12s,border-color .12s,background .12s;
  }
  .tabbtn:hover:not(.disabled){color:var(--navy);background:var(--navy-light);}
  .tabbtn.active{color:var(--navy-dark);border-bottom-color:var(--navy);}
  .tabbtn.disabled{color:#b6bacb;cursor:not-allowed;opacity:.65;}
  .tabbtn:focus-visible{outline:2px solid var(--navy-mid);outline-offset:-2px;}

  .panel{display:none;padding:15px 16px 17px;}
  .panel.active{display:block;}

  .kv{display:grid;grid-template-columns:max-content 1fr;gap:7px 16px;}
  .kv dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding-top:1px;}
  .kv dd{margin:0;font-size:.92rem;color:var(--ink);}
  .kv dd .pill{
    display:inline-block;font-size:.7rem;font-weight:600;
    padding:1px 8px;border-radius:12px;background:var(--navy-light);
    color:var(--navy);border:1px solid #cdd4f1;
  }
  .kv dd .pill.conf{background:var(--green-bg);color:var(--green);border-color:#bcdcc9;}
  .ov-notes{margin-top:13px;padding-top:12px;border-top:1px dashed var(--line);}
  .ov-notes .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:5px;}
  .ov-notes p{margin:0;font-size:.9rem;color:var(--ink);}

  ul.req{margin:0;padding:0;list-style:none;}
  ul.req li{
    position:relative;padding:5px 0 5px 18px;font-size:.91rem;
    border-bottom:1px solid var(--line-soft);
  }
  ul.req li:last-child{border-bottom:none;}
  ul.req li::before{
    content:"";position:absolute;left:2px;top:11px;
    width:6px;height:6px;border-radius:50%;background:var(--navy-mid);
  }
  .panel.p-cat ul.req li::before{background:var(--amber);}
  .panel.p-av ul.req li::before{background:var(--green);}
  .panel.p-note ul.req li::before{background:var(--red);}
  ul.req li b{color:var(--navy-dark);font-weight:700;}
  .empty{font-size:.88rem;color:#9499ad;font-style:italic;padding:4px 0;}

  /* ---------- FOOTER ---------- */
  footer.site{
    background:var(--navy-dark);color:rgba(255,255,255,.82);
    text-align:center;padding:18px 16px;
    font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
  }

  @media (max-width:560px){
    .site-inner{padding:14px 16px;gap:13px;}
    .wordmark{font-size:1.4rem;letter-spacing:.14em;}
    .meta .wk{font-size:.92rem;}
    .timepill{min-width:56px;font-size:.7rem;}
    .ch-title{font-size:.96rem;}
    main{padding:14px 11px 36px;}
    .kv{grid-template-columns:1fr;gap:2px 0;}
    .kv dt{padding-top:8px;}
    .kv dt:first-child{padding-top:0;}
  }
</style>
</head>

/* ============================================================
   RENDER
   ============================================================ */
const TABS = [
  {key:"overview", label:"Overview"},
  {key:"catering", label:"Catering"},
  {key:"estates",  label:"Estates & Porters"},
  {key:"av",       label:"AV & Tech"},
  {key:"other",    label:"Other Notes"}
];

const dayNav   = document.getElementById('dayNav');
const cardList = document.getElementById('cardList');
const dayTitle = document.getElementById('dayTitle');
const dayCount = document.getElementById('dayCount');
let activeDay = 0;

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function badgesFor(ev){
  const b=[];
  if(ev.catering && ev.catering.length) b.push('<span class="badge b-cat">Catering</span>');
  if(ev.estates  && ev.estates.length)  b.push('<span class="badge b-est">Estates</span>');
  if(ev.av       && ev.av.length)        b.push('<span class="badge b-av">AV</span>');
  if(ev.other    && ev.other.length)     b.push('<span class="badge b-note">Notes</span>');
  return b.join('');
}

function reqList(items, cls){
  if(!items || !items.length) return '<p class="empty">No requirements noted.</p>';
  return '<ul class="req'+(cls?' '+cls:'')+'">'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
}

function overviewPanel(ev){
  const statusCls = /confirmed/i.test(ev.status) ? ' conf' : '';
  let kv = '<dl class="kv">'+
    '<dt>Room</dt><dd>'+esc(ev.rooms)+'</dd>'+
    '<dt>Numbers</dt><dd>'+esc(ev.numbers)+'</dd>'+
    '<dt>Ref</dt><dd>'+esc(ev.ref)+'</dd>'+
    '<dt>Manager</dt><dd>'+esc(ev.manager)+'</dd>'+
    '<dt>Type</dt><dd>'+esc(ev.type)+'</dd>'+
    '<dt>Status</dt><dd><span class="pill'+statusCls+'">'+esc(ev.status)+'</span></dd>'+
    '</dl>';
  if(ev.ovNotes && ev.ovNotes.trim()){
    kv += '<div class="ov-notes"><div class="lbl">Key notes</div><p>'+ev.ovNotes+'</p></div>';
  }
  return kv;
}

function renderCardBody(ev, idx){
  const content = {
    overview: overviewPanel(ev),
    catering: reqList(ev.catering,'p-cat'),
    estates:  reqList(ev.estates),
    av:       reqList(ev.av,'p-av'),
    other:    reqList(ev.other,'p-note')
  };
  const has = {
    overview:true,
    catering:!!(ev.catering&&ev.catering.length),
    estates:!!(ev.estates&&ev.estates.length),
    av:!!(ev.av&&ev.av.length),
    other:!!(ev.other&&ev.other.length)
  };
  const firstActive = 'overview';

  const strip = TABS.map(t=>{
    const dis = has[t.key] ? '' : ' disabled';
    const act = t.key===firstActive ? ' active' : '';
    return '<button class="tabbtn'+act+dis+'" data-tab="'+t.key+'" data-card="'+idx+'"'+
           (has[t.key]?'':' aria-disabled="true" tabindex="-1"')+'>'+t.label+'</button>';
  }).join('');

  const panels = TABS.map(t=>{
    const act = t.key===firstActive ? ' active' : '';
    const pcls = t.key==='catering'?' p-cat':t.key==='av'?' p-av':t.key==='other'?' p-note':'';
    return '<div class="panel'+pcls+act+'" data-panel="'+t.key+'" data-card="'+idx+'">'+content[t.key]+'</div>';
  }).join('');

  return '<div class="card-body"><div class="tabstrip">'+strip+'</div>'+panels+'</div>';
}

function renderDay(d){
  const day = WEEK[d];
  dayTitle.textContent = day.fullDate;
  const n = day.events.length;
  dayCount.textContent = n+' event'+(n===1?'':'s');

  cardList.innerHTML = day.events.map((ev,i)=>{
    return '<article class="card" data-card="'+i+'">'+
      '<button class="card-head" data-toggle="'+i+'" aria-expanded="false">'+
        '<span class="timepill">'+esc(ev.from)+'<small>'+esc(ev.to)+'</small></span>'+
        '<span class="ch-main">'+
          '<span class="ch-title">'+esc(ev.title)+'</span>'+
          '<span class="ch-sub"><span class="mgr">'+esc(ev.manager)+'</span><span class="ch-type">'+esc(ev.type)+'</span><span>Ref '+esc(ev.ref)+'</span></span>'+
          '<span class="badges">'+badgesFor(ev)+'</span>'+
        '</span>'+
        '<span class="chev" aria-hidden="true">▾</span>'+
      '</button>'+
      renderCardBody(ev,i)+
    '</article>';
  }).join('');

  // re-bind
  cardList.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const card = btn.closest('.card');
      const open = card.classList.toggle('open');
      btn.setAttribute('aria-expanded', open?'true':'false');
    });
  });
  cardList.querySelectorAll('.tabbtn:not(.disabled)').forEach(tb=>{
    tb.addEventListener('click',(e)=>{
      e.stopPropagation();
      const card = tb.closest('.card');
      const key = tb.dataset.tab;
      card.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));
      card.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      tb.classList.add('active');
      card.querySelector('.panel[data-panel="'+key+'"]').classList.add('active');
    });
  });
}

function renderNav(){
  dayNav.innerHTML = WEEK.map((d,i)=>{
    return '<button class="daytab'+(i===activeDay?' active':'')+'" data-day="'+i+'">'+
      '<span class="dn">'+d.day.slice(0,3)+'</span>'+
      '<span class="dd">'+d.dateNum+'</span>'+
      '<span class="dc">'+d.events.length+'</span>'+
    '</button>';
  }).join('');
  dayNav.querySelectorAll('[data-day]').forEach(b=>{
    b.addEventListener('click',()=>{
      activeDay = +b.dataset.day;
      dayNav.querySelectorAll('.daytab').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      renderDay(activeDay);
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

// Default to the current weekday if it falls within the week, else Monday.
(function initDay(){
  const today = new Date();
  const map = {1:0,2:1,3:2,4:3,5:4,6:5,0:6}; // JS getDay -> Mon..Sun index
  const wd = map[today.getDay()];
  // Only auto-select if today is actually within this planner's week.
  const target = new Date(2026,5,29); // Mon 29 Jun 2026
  const diff = Math.floor((today - target)/(1000*60*60*24));
  if(diff>=0 && diff<=6){ activeDay = diff; }
})();

renderNav();
renderDay(activeDay);
</script>
