/* ============================================================
   ALLEYN'S EVENTS — INTERNAL EVENTS PLANNER 
   Brand: Navy #2B3A8F, Futura PT
   ============================================================ */

:root {
  --navy: #2B3A8F;
  --navy-dark: #1a2460;
  --navy-mid: #3a4fa8;
  --navy-light: #eef0fa;
  --bg: #f2f3f8;
  --card: #ffffff;
  --border: #e1e4f0;
  --border-strong: #c8cee4;
  --ink: #1a1f3a;
  --ink-soft: #4a5170;
  --muted: #8a90a8;
  --amber: #c47a17;
  --amber-bg: #fdf3e1;
  --amber-border: #f0d29a;
  --green: #2f7a4a;
  --green-bg: #e6f4ec;
  --green-border: #a8d4ba;
  --red: #b03030;
  --red-bg: #fbe9e9;
  --red-border: #efb4b4;
  --navy-badge-bg: #e6e9f5;
  --navy-badge-border: #c0c7e2;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Futura PT', 'Century Gothic', Futura, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
  color: white;
  padding: 18px 32px;
  box-shadow: 0 2px 12px rgba(26, 36, 96, 0.18);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}

.brand {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  white-space: nowrap;
}

.divider {
  width: 1px;
  height: 36px;
  background: rgba(255, 255, 255, 0.25);
}

.header-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.week-label {
  font-size: 14px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.95);
}

.date-range {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(255, 255, 255, 0.7);
}

.internal-tag {
  margin-left: auto;
  padding: 5px 12px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.9);
  white-space: nowrap;
}

/* ============================================================
   DAY NAVIGATION
   ============================================================ */
.day-nav {
  position: sticky;
  top: 73px;
  z-index: 90;
  background: white;
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 6px rgba(26, 36, 96, 0.04);
}

.day-nav-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 16px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}

.day-nav-inner::-webkit-scrollbar { height: 6px; }
.day-nav-inner::-webkit-scrollbar-track { background: transparent; }
.day-nav-inner::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.day-tab {
  flex: 0 0 auto;
  padding: 12px 18px;
  background: none;
  border: none;
  border-bottom: 3px solid transparent;
  cursor: pointer;
  font-family: inherit;
  text-align: center;
  transition: all 0.18s ease;
  color: var(--ink-soft);
  min-width: 88px;
}

.day-tab:hover {
  background: var(--navy-light);
  color: var(--navy);
}

.day-tab.active {
  border-bottom-color: var(--navy);
  color: var(--navy);
  background: var(--navy-light);
}

.day-tab-day {
  display: block;
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
  opacity: 0.75;
}

.day-tab-date {
  display: block;
  font-size: 22px;
  font-weight: 600;
  line-height: 1.1;
  margin: 3px 0 2px;
}

.day-tab-count {
  display: block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.day-tab.active .day-tab-count {
  color: var(--navy-mid);
}

.day-tab.empty .day-tab-count { color: var(--muted); opacity: 0.55; }

/* ============================================================
   MAIN CONTENT
   ============================================================ */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

.day-section { display: none; }
.day-section.active { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.day-heading {
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 2px solid var(--navy);
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}

.day-heading h2 {
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--navy-dark);
}

.day-heading .day-event-count {
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

.empty-day {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  font-style: italic;
  background: white;
  border: 1px dashed var(--border-strong);
  border-radius: 6px;
}

/* ============================================================
   EVENT CARDS
   ============================================================ */
.event-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.event-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

.event-card:hover {
  border-color: var(--border-strong);
  box-shadow: 0 2px 8px rgba(26, 36, 96, 0.06);
}

.event-card.expanded {
  border-color: var(--navy);
  box-shadow: 0 4px 16px rgba(26, 36, 96, 0.1);
}

.event-summary {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  flex-wrap: wrap;
}

.time-pill {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: var(--navy);
  color: white;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
  min-width: 110px;
  justify-content: center;
}

.event-main {
  flex: 1 1 280px;
  min-width: 0;
}

.event-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 3px;
}

.event-meta {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.04em;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.event-meta span { display: inline-flex; align-items: center; }
.event-meta .dot::before { content: "·"; margin-right: 8px; opacity: 0.6; }

.badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 0 0 auto;
}

.badge {
  display: inline-block;
  padding: 3px 9px;
  border-radius: 3px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  border: 1px solid;
}

.badge-catering { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
.badge-estates { background: var(--navy-badge-bg); color: var(--navy); border-color: var(--navy-badge-border); }
.badge-av { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
.badge-notes { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }

.expand-icon {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--navy-mid);
  transition: transform 0.22s ease;
}

.event-card.expanded .expand-icon { transform: rotate(180deg); }

/* ============================================================
   EXPANDED PANEL
   ============================================================ */
.event-detail {
  display: none;
  border-top: 1px solid var(--border);
  background: #fafbfd;
}

.event-card.expanded .event-detail { display: block; }

.tabs {
  display: flex;
  background: white;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 1 1 auto;
  padding: 13px 14px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  min-width: max-content;
}

.tab-btn:hover:not(:disabled) {
  color: var(--navy);
  background: var(--navy-light);
}

.tab-btn.active {
  color: var(--navy);
  border-bottom-color: var(--navy);
}

.tab-btn:disabled {
  color: var(--muted);
  opacity: 0.4;
  cursor: not-allowed;
}

.tab-btn .tab-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-left: 6px;
  vertical-align: middle;
}
.tab-dot-catering { background: var(--amber); }
.tab-dot-estates { background: var(--navy); }
.tab-dot-av { background: var(--green); }
.tab-dot-notes { background: var(--red); }

.tab-content { display: none; padding: 20px 22px; }
.tab-content.active { display: block; }

/* Overview tab — key-value grid */
.kv-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px 24px;
}

.kv {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.kv-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

.kv-value {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  line-height: 1.4;
  word-wrap: break-word;
}

.kv-value.status-confirmed { color: var(--green); }
.kv-value.status-provisional { color: var(--amber); }
.kv-value.status-invoice { color: var(--navy); }
.kv-value.status-hire { color: var(--navy); }

.overview-notes {
  margin-top: 18px;
  padding: 14px 16px;
  background: white;
  border: 1px solid var(--border);
  border-left: 3px solid var(--navy);
  border-radius: 4px;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.55;
  white-space: pre-line;
}

/* Other tabs — bulleted list */
.req-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.req-list li {
  position: relative;
  padding: 10px 14px 10px 32px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink);
}

.req-list li::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 17px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--navy);
}

.req-list .req-title {
  display: block;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 4px;
}

.req-list .req-body { white-space: pre-line; }

.empty-state {
  padding: 24px 14px;
  text-align: center;
  color: var(--muted);
  font-style: italic;
  font-size: 13px;
}

/* ============================================================
   FOOTER
   ============================================================ */
footer {
  background: var(--navy-dark);
  color: rgba(255, 255, 255, 0.7);
  text-align: center;
  padding: 18px 20px;
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-weight: 500;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 720px) {
  .site-header { padding: 14px 18px; }
  .header-inner { gap: 14px; }
  .brand { font-size: 17px; letter-spacing: 0.18em; }
  .divider { height: 28px; }
  .week-label { font-size: 12px; }
  .date-range { font-size: 11px; }
  .internal-tag {
    margin-left: 0;
    order: 99;
    flex: 1 1 100%;
    text-align: center;
  }
  .day-nav { top: 119px; }
  .day-tab { padding: 10px 12px; min-width: 70px; }
  .day-tab-date { font-size: 18px; }
  .day-tab-count { font-size: 9px; }
  main { padding: 20px 14px 40px; }
  .day-heading h2 { font-size: 22px; }
  .event-summary { padding: 12px 14px; gap: 10px; }
  .time-pill { min-width: auto; padding: 5px 9px; font-size: 11px; }
  .event-title { font-size: 15px; }
  .badges { flex: 1 1 100%; }
  .expand-icon { width: 18px; height: 18px; }
  .tab-content { padding: 16px 14px; }
  .kv-grid { grid-template-columns: 1fr 1fr; gap: 12px 16px; }
}

@media (max-width: 480px) {
  .kv-grid { grid-template-columns: 1fr; }
  .header-inner { gap: 10px; }
  .divider { display: none; }
  .day-nav { top: 142px; }
}

/* ============================================================
   PRINT
   ============================================================ */
@media print {
  .day-nav, .expand-icon, footer { display: none; }
  .site-header { position: static; }
  .event-card { page-break-inside: avoid; }
  .day-section { display: block !important; }
  .event-detail { display: block !important; }
  .tab-content { display: block !important; padding: 12px 0; }
  .tabs { display: none; }
  body { background: white; }
}
</style>

/* ============================================================
   RENDERING
   ============================================================ */
function eventsByDay(dayKey) {
  return EVENTS.filter(e => e.day === dayKey)
    .sort((a, b) => a.start.localeCompare(b.start));
}

function statusClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('confirm')) return 'status-confirmed';
  if (s.includes('provisional')) return 'status-provisional';
  if (s.includes('invoice')) return 'status-invoice';
  if (s.includes('hire')) return 'status-hire';
  return '';
}

function badgesFor(event) {
  const out = [];
  if (event.catering && event.catering.length) out.push(['Catering', 'badge-catering']);
  if (event.estates && event.estates.length) out.push(['Estates', 'badge-estates']);
  if (event.av && event.av.length) out.push(['AV', 'badge-av']);
  if (event.notes && event.notes.length) out.push(['Notes', 'badge-notes']);
  return out;
}

function renderDayNav() {
  const nav = document.getElementById('dayNav');
  nav.innerHTML = DAYS.map((d, i) => {
    const count = eventsByDay(d.key).length;
    const emptyClass = count === 0 ? ' empty' : '';
    return `
      <button class="day-tab${emptyClass}" data-day-index="${i}" type="button">
        <span class="day-tab-day">${d.day}</span>
        <span class="day-tab-date">${d.date}</span>
        <span class="day-tab-count">${count} event${count === 1 ? '' : 's'}</span>
      </button>
    `;
  }).join('');
  nav.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => selectDay(parseInt(btn.dataset.dayIndex, 10)));
  });
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = DAYS.map((d, i) => {
    const events = eventsByDay(d.key);
    const count = events.length;
    const inner = count === 0
      ? `<div class="empty-day">No events scheduled.</div>`
      : `<div class="event-list">${events.map(e => renderCard(e)).join('')}</div>`;
    return `
      <section class="day-section" data-day-section="${i}" id="day-${i}">
        <div class="day-heading">
          <h2>${d.full}</h2>
          <span class="day-event-count">${count} event${count === 1 ? '' : 's'}</span>
        </div>
        ${inner}
      </section>
    `;
  }).join('');

  main.querySelectorAll('.event-summary').forEach(summary => {
    summary.addEventListener('click', () => {
      const card = summary.closest('.event-card');
      card.classList.toggle('expanded');
    });
  });

  main.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (btn.disabled) return;
      const detail = btn.closest('.event-detail');
      detail.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      detail.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.target;
      detail.querySelector('[data-tab="' + target + '"]').classList.add('active');
    });
  });
}

function renderCard(e) {
  const badges = badgesFor(e);
  const cardId = `ev-${e.ref}-${e.day}`;
  return `
    <article class="event-card" id="${cardId}">
      <header class="event-summary" role="button" tabindex="0">
        <span class="time-pill">${e.start} – ${e.end}</span>
        <div class="event-main">
          <div class="event-title">${e.title}</div>
          <div class="event-meta">
            <span>${e.manager || '—'}</span>
            <span class="dot">Ref ${e.ref}</span>
            ${e.numbers !== undefined ? `<span class="dot">${e.numbers} attendee${e.numbers === 1 ? '' : 's'}</span>` : ''}
          </div>
        </div>
        <div class="badges">
          ${badges.map(([label, cls]) => `<span class="badge ${cls}">${label}</span>`).join('')}
        </div>
        <span class="expand-icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 5L7 9L11 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </header>
      <div class="event-detail">
        ${renderTabs(e)}
        ${renderTabContents(e)}
      </div>
    </article>
  `;
}

function renderTabs(e) {
  const hasCatering = e.catering && e.catering.length;
  const hasEstates = e.estates && e.estates.length;
  const hasAv = e.av && e.av.length;
  const hasNotes = e.notes && e.notes.length;
  return `
    <div class="tabs" role="tablist">
      <button class="tab-btn active" data-target="overview" type="button">Overview</button>
      <button class="tab-btn" data-target="catering" type="button"${hasCatering ? '' : ' disabled'}>Catering${hasCatering ? '<span class="tab-dot tab-dot-catering"></span>' : ''}</button>
      <button class="tab-btn" data-target="estates" type="button"${hasEstates ? '' : ' disabled'}>Estates &amp; Porters${hasEstates ? '<span class="tab-dot tab-dot-estates"></span>' : ''}</button>
      <button class="tab-btn" data-target="av" type="button"${hasAv ? '' : ' disabled'}>AV &amp; Tech${hasAv ? '<span class="tab-dot tab-dot-av"></span>' : ''}</button>
      <button class="tab-btn" data-target="notes" type="button"${hasNotes ? '' : ' disabled'}>Other Notes${hasNotes ? '<span class="tab-dot tab-dot-notes"></span>' : ''}</button>
    </div>
  `;
}

function renderTabContents(e) {
  return `
    ${renderOverview(e)}
    ${renderRequirements(e.catering, 'catering')}
    ${renderRequirements(e.estates, 'estates')}
    ${renderRequirements(e.av, 'av')}
    ${renderRequirements(e.notes, 'notes')}
  `;
}

function renderOverview(e) {
  const sc = statusClass(e.status);
  return `
    <div class="tab-content active" data-tab="overview">
      <div class="kv-grid">
        <div class="kv">
          <span class="kv-label">Room(s)</span>
          <span class="kv-value">${e.rooms || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Numbers</span>
          <span class="kv-value">${e.numbers !== undefined ? e.numbers + ' attendee' + (e.numbers === 1 ? '' : 's') : '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Reference</span>
          <span class="kv-value">${e.ref}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Event Manager</span>
          <span class="kv-value">${e.manager || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Status</span>
          <span class="kv-value ${sc}">${e.status || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Type</span>
          <span class="kv-value">${e.type || '—'}</span>
        </div>
        <div class="kv">
          <span class="kv-label">Time</span>
          <span class="kv-value">${e.start} – ${e.end}</span>
        </div>
      </div>
      ${e.overviewNote ? `<div class="overview-notes">${e.overviewNote}</div>` : ''}
    </div>
  `;
}

function renderRequirements(items, tabKey) {
  if (!items || items.length === 0) {
    return `
      <div class="tab-content" data-tab="${tabKey}">
        <div class="empty-state">No requirements noted.</div>
      </div>
    `;
  }
  return `
    <div class="tab-content" data-tab="${tabKey}">
      <ul class="req-list">
        ${items.map(item => `
          <li>
            ${item.title ? `<span class="req-title">${item.title}</span>` : ''}
            <span class="req-body">${item.body}</span>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

function selectDay(index) {
  document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === index));
  document.querySelectorAll('.day-section').forEach((s, i) => s.classList.toggle('active', i === index));
  // scroll the active day tab into view on mobile
  const activeTab = document.querySelectorAll('.day-tab')[index];
  if (activeTab && activeTab.scrollIntoView) {
    activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }
}

function init() {
  renderDayNav();
  renderMain();

  // Default to today if it falls within range, otherwise first day with events
  const today = new Date().toISOString().slice(0, 10);
  let idx = DAYS.findIndex(d => d.key === today);
  if (idx < 0) idx = DAYS.findIndex(d => eventsByDay(d.key).length > 0);
  if (idx < 0) idx = 0;
  selectDay(idx);
}

document.addEventListener('DOMContentLoaded', init);
</script>
