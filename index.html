:root {
  --blue: #5576d1;
  --blue-dark: #3f5cb0;
  --blue-accent: #a7c6ed;
  --blue-faint: #f2f5fc;

  --gold: #ffb838;
  --teal: #2ad2c9;
  --pink: #edb5db;
  --green: #c5e86c;
  --yellow: #f4da40;
  --red: #e11d48;

  --text: #1e293b;
  --text-mid: #475569;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --page-bg: #f2f3f8;
  --card-bg: #ffffff;

  --radius: 4px;
  --radius-lg: 8px;
  --font: 'Futura PT', Futura, 'Century Gothic', Arial, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

html, body {
  background: var(--page-bg);
}

body {
  font-family: var(--font);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  font-size: 14px;
  letter-spacing: 0.01em;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

/* ── Gentle "Welcome back" watermark ─────────────────────────────────── */
.watermark {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.watermark-inner {
  position: absolute;
  top: -20%;
  left: -20%;
  width: 140%;
  height: 140%;
  display: flex;
  flex-wrap: wrap;
  align-content: space-between;
  transform: rotate(-14deg);
  opacity: 0.05;
}
.watermark-inner span {
  flex: 0 0 33.33%;
  text-align: center;
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--blue);
  white-space: nowrap;
  padding: 26px 0;
}
.watermark-inner span:nth-child(3n+2) { color: var(--gold); }
.watermark-inner span:nth-child(5n) { color: var(--blue-dark); }

.app { position: relative; z-index: 1; }

.sticky-top {
  position: sticky;
  top: 0;
  z-index: 200;
}

/* ── Header ───────────────────────────────────────────────────────────── */
.header {
  background: var(--blue);
  min-height: 72px;
  display: flex;
  align-items: center;
  padding: 12px 40px;
  gap: 20px;
  flex-wrap: wrap;
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-crest {
  height: 40px;
  object-fit: contain;
  display: block;
}

.header-brand-text {
  color: #fff;
  font-size: 18px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  white-space: nowrap;
}

.header-brand-text em {
  color: var(--gold);
  font-style: normal;
  margin: 0 10px;
  font-size: 20px;
}

.header-divider {
  width: 1px;
  align-self: stretch;
  background: rgba(255,255,255,0.28);
  flex-shrink: 0;
}

.header-week {
  color: #fff;
  flex: 1;
  min-width: 180px;
}

.header-week-label {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.header-week-range {
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.02em;
  margin-top: 2px;
}

.header-internal {
  color: rgba(255,255,255,0.9);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: var(--radius);
  padding: 6px 12px;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ── Week navigation ──────────────────────────────────────────────────── */
.week-nav-wrap {
  background: var(--blue-dark);
}

.week-nav {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  gap: 2px;
}

.week-tab {
  flex: 1;
  padding: 9px 10px;
  text-align: center;
  cursor: pointer;
  border: none;
  background: transparent;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.75);
  transition: background 0.15s ease, color 0.15s ease;
}

.week-tab:hover { background: rgba(255,255,255,0.08); color: #fff; }

.week-tab.active {
  background: var(--blue-faint);
  color: var(--blue-dark);
}

.week-tab .week-tab-range {
  display: block;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0.01em;
  font-size: 10px;
  opacity: 0.85;
  margin-top: 2px;
}

/* ── Day navigation ───────────────────────────────────────────────────── */
.day-nav-wrap {
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 6px rgba(30,41,59,0.04);
}

.day-nav {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  overflow-x: auto;
  scrollbar-width: thin;
}

.day-tab {
  flex: 1;
  min-width: 118px;
  padding: 14px 10px 12px;
  text-align: center;
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 3px solid transparent;
  font-family: var(--font);
  transition: background 0.15s ease;
  position: relative;
}

.day-tab:hover { background: var(--blue-faint); }

.day-tab.active {
  border-bottom-color: var(--gold);
  background: var(--blue-faint);
}

.day-tab.empty { opacity: 0.45; }

.day-tab-name {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-mid);
}

.day-tab.active .day-tab-name { color: var(--blue); }

.day-tab-num {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin: 3px 0 6px;
}

.day-tab.active .day-tab-num { color: var(--blue); }

.day-tab-count {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--blue-faint);
  color: var(--blue);
}

.day-tab.active .day-tab-count {
  background: var(--blue);
  color: #fff;
}

.day-tab.empty .day-tab-count {
  background: var(--border);
  color: var(--text-muted);
}

/* ── Page ─────────────────────────────────────────────────────────────── */
.page {
  max-width: 1080px;
  margin: 0 auto;
  padding: 28px 24px 80px;
}

.day-panel { display: none; }
.day-panel.visible { display: block; }

.empty-day {
  background: var(--card-bg);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 48px 24px;
  text-align: center;
  color: var(--text-muted);
  font-size: 14px;
}

/* ── Event card ───────────────────────────────────────────────────────── */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  overflow: hidden;
  transition: box-shadow 0.15s ease;
}

.card:hover { box-shadow: 0 4px 14px rgba(30,41,59,0.06); }

.card-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 18px 12px;
  cursor: pointer;
}

.time-pill {
  flex-shrink: 0;
  background: var(--blue);
  color: #fff;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.02em;
  border-radius: var(--radius);
  padding: 8px 12px;
  text-align: center;
  min-width: 78px;
  line-height: 1.35;
}

.time-pill .sep { opacity: 0.6; font-weight: 400; display:block; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin: 1px 0; }

.card-title-wrap { flex: 1; min-width: 0; }

.card-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.01em;
}

.card-ref {
  flex-shrink: 0;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  white-space: nowrap;
  margin-top: 3px;
}

.status-tag {
  display: inline-block;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  margin-left: 8px;
  background: #fefce8;
  color: #92400e;
  border: 1px solid var(--gold);
  vertical-align: middle;
}

.chev {
  display: inline-block;
  width: 10px;
  height: 10px;
  background: var(--gold);
  clip-path: polygon(0 0, 100% 0, 69% 100%, 0% 100%);
  flex-shrink: 0;
}

/* Space band */
.space-band {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--blue-faint);
  border-left: 4px solid var(--gold);
  border-radius: var(--radius);
  padding: 9px 14px;
  margin-top: 10px;
}

.space-headline {
  font-weight: 700;
  color: var(--blue);
  font-size: 13px;
  letter-spacing: 0.01em;
}

.space-sub {
  color: var(--text-muted);
  font-size: 12px;
}

.space-sub::before {
  content: '\00b7';
  margin: 0 6px;
  font-weight: 700;
}

.card-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-mid);
}

.card-meta-row b { color: var(--text); }

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid transparent;
}

.badge-catering { background: #fff8ea; color: #92400e; border-color: var(--gold); }
.badge-estates  { background: var(--blue-faint); color: var(--blue-dark); border-color: var(--blue-accent); }
.badge-av       { background: #f1fbe9; color: #3f6212; border-color: var(--green); }
.badge-other    { background: var(--red-light, #fff1f2); color: var(--red); border-color: #fecdd3; }

.card-expand-icon {
  flex-shrink: 0;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 13px;
  transition: transform 0.2s ease;
  margin-top: 2px;
}

.card.open .card-expand-icon { transform: rotate(180deg); border-color: var(--blue); color: var(--blue); }

/* Expandable body */
.card-body {
  display: none;
  border-top: 1px solid var(--border);
}

.card.open .card-body { display: block; }

.tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: #fafbfd;
}

.tab-btn {
  font-family: var(--font);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 11px 16px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
}

.tab-btn.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
  background: #fff;
}

.tab-btn.disabled {
  color: #cbd5e1;
  cursor: not-allowed;
}

.tab-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.dot-catering { background: var(--gold); }
.dot-estates  { background: var(--blue); }
.dot-av       { background: var(--green); }
.dot-other    { background: var(--red); }

.tab-panel { display: none; padding: 18px 20px 22px; }
.tab-panel.active { display: block; }

.kv-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 24px;
  margin-bottom: 20px;
}

.kv { display: flex; flex-direction: column; gap: 3px; }

.kv-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.kv-value { font-size: 13px; color: var(--text); font-weight: 600; }

.subhead {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--blue);
  margin: 18px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.subhead:first-child { margin-top: 0; }

.room-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

.room-item { display: flex; gap: 10px; align-items: flex-start; }

.room-item .chev { margin-top: 5px; }

.room-item-text { font-size: 13px; color: var(--text-mid); }

.room-item-text b { color: var(--text); }

.room-item-building { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }

.room-item-notes { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }

.note-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

.note-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text-mid); line-height: 1.55; }

.note-list li .dot { margin-top: 7px; flex-shrink: 0; }

.no-req { color: var(--text-muted); font-style: italic; font-size: 13px; }

.catering-block { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.catering-block:last-child { margin-bottom: 0; }

.catering-block-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  margin-bottom: 6px;
}

.catering-block-head b { color: var(--blue-dark); }

.catering-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
}

/* ── Footer ───────────────────────────────────────────────────────────── */
.footer {
  background: var(--blue);
  color: rgba(255,255,255,0.92);
  text-align: center;
  padding: 22px 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
}

.footer em { color: var(--gold); font-style: normal; margin: 0 10px; }

/* ── Responsive ───────────────────────────────────────────────────────── */
@media (max-width: 720px) {
  .header { padding: 12px 18px; }
  .header-week { order: 3; flex-basis: 100%; }
  .header-divider { display: none; }
  .page { padding: 20px 14px 60px; }
  .kv-grid { grid-template-columns: 1fr; }
  .card-head { padding: 14px 14px 10px; }
  .day-tab { min-width: 96px; }
  .watermark-inner span { font-size: 24px; }
}
</style>

const WEEKS = [{"label": "Week 1", "range": "Monday 7 &ndash; Sunday 13 September 2026", "days": [{"key": "Mon", "label": "Monday", "num": "7", "date": "2026-09-07"}, {"key": "Tue", "label": "Tuesday", "num": "8", "date": "2026-09-08"}, {"key": "Wed", "label": "Wednesday", "num": "9", "date": "2026-09-09"}, {"key": "Thu", "label": "Thursday", "num": "10", "date": "2026-09-10"}, {"key": "Fri", "label": "Friday", "num": "11", "date": "2026-09-11"}, {"key": "Sat", "label": "Saturday", "num": "12", "date": "2026-09-12"}, {"key": "Sun", "label": "Sunday", "num": "13", "date": "2026-09-13"}], "watermark": true}, {"label": "Week 2", "range": "Monday 14 &ndash; Sunday 20 September 2026", "days": [{"key": "Mon", "label": "Monday", "num": "14", "date": "2026-09-14"}, {"key": "Tue", "label": "Tuesday", "num": "15", "date": "2026-09-15"}, {"key": "Wed", "label": "Wednesday", "num": "16", "date": "2026-09-16"}, {"key": "Thu", "label": "Thursday", "num": "17", "date": "2026-09-17"}, {"key": "Fri", "label": "Friday", "num": "18", "date": "2026-09-18"}, {"key": "Sat", "label": "Saturday", "num": "19", "date": "2026-09-19"}, {"key": "Sun", "label": "Sunday", "num": "20", "date": "2026-09-20"}], "watermark": false}, {"label": "Week 3", "range": "Monday 21 &ndash; Sunday 27 September 2026", "days": [{"key": "Mon", "label": "Monday", "num": "21", "date": "2026-09-21"}, {"key": "Tue", "label": "Tuesday", "num": "22", "date": "2026-09-22"}, {"key": "Wed", "label": "Wednesday", "num": "23", "date": "2026-09-23"}, {"key": "Thu", "label": "Thursday", "num": "24", "date": "2026-09-24"}, {"key": "Fri", "label": "Friday", "num": "25", "date": "2026-09-25"}, {"key": "Sat", "label": "Saturday", "num": "26", "date": "2026-09-26"}, {"key": "Sun", "label": "Sunday", "num": "27", "date": "2026-09-27"}], "watermark": false}];

function pad(n){ return n.toString().padStart(2,'0'); }

function to12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'pm' : 'am';
  let hh = h % 12; if(hh===0) hh = 12;
  return m === 0 ? `${hh}${period}` : `${hh}:${pad(m)}${period}`;
}

const eventsByDate = {};
EVENTS.forEach(e => {
  if(!eventsByDate[e.date]) eventsByDate[e.date] = [];
  eventsByDate[e.date].push(e);
});
Object.keys(eventsByDate).forEach(k => eventsByDate[k].sort((a,b) => a.start.localeCompare(b.start)));

function firstActiveDate(weekIdx){
  const days = WEEKS[weekIdx].days;
  const withEvents = days.find(d => (eventsByDate[d.date]||[]).length > 0);
  return (withEvents || days[0]).date;
}

let currentWeek = 0;
let currentDate = firstActiveDate(currentWeek);

function renderWatermark(){
  const el = document.getElementById('watermarkInner');
  const cells = 48;
  let html = '';
  for(let i=0;i<cells;i++) html += '<span>WELCOME BACK!</span>';
  el.innerHTML = html;
}

function updateWatermarkVisibility(){
  const wm = document.querySelector('.watermark');
  wm.style.display = WEEKS[currentWeek].watermark ? '' : 'none';
}

function renderWeekNav(){
  const nav = document.getElementById('weekNav');
  nav.innerHTML = WEEKS.map((w,i) => {
    const active = i === currentWeek ? 'active' : '';
    return `<button class="week-tab ${active}" onclick="selectWeek(${i})">
      ${w.label}<span class="week-tab-range">${w.range}</span>
    </button>`;
  }).join('');
}

function selectWeek(idx){
  currentWeek = idx;
  currentDate = firstActiveDate(currentWeek);
  renderWeekNav();
  renderDayNav();
  renderHeader();
  updateWatermarkVisibility();
  renderPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderHeader(){
  document.getElementById('headerWeekLabel').innerHTML = `Michaelmas Term 2026 &mdash; ${WEEKS[currentWeek].label}`;
  document.getElementById('headerWeekRange').innerHTML = WEEKS[currentWeek].range + (WEEKS[currentWeek].watermark ? ' &nbsp;&middot;&nbsp; Welcome back!' : '');
}

function renderDayNav(){
  const nav = document.getElementById('dayNav');
  const days = WEEKS[currentWeek].days;
  nav.innerHTML = days.map(d => {
    const count = (eventsByDate[d.date]||[]).length;
    const empty = count === 0 ? 'empty' : '';
    const active = d.date === currentDate ? 'active' : '';
    return `<button class="day-tab ${empty} ${active}" data-date="${d.date}" onclick="selectDay('${d.date}')">
      <div class="day-tab-name">${d.label}</div>
      <div class="day-tab-num">${d.num}</div>
      <div class="day-tab-count">${count} ${count===1?'event':'events'}</div>
    </button>`;
  }).join('');
}

function selectDay(dateStr){
  currentDate = dateStr;
  renderDayNav();
  renderPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function roomLine(r){
  const timeStr = (r.from && r.to) ? `${to12(r.from)}&ndash;${to12(r.to)}` : '';
  return `<li class="room-item">
    <span class="chev"></span>
    <div class="room-item-text">
      <div class="room-item-building">${esc(r.building)}</div>
      <b>${esc(r.room)}</b> &nbsp;${esc(r.layout)} ${timeStr ? `&nbsp;&middot;&nbsp;${timeStr}` : ''} ${r.equipment ? `&nbsp;&middot;&nbsp;${esc(r.equipment)}` : ''}
      ${r.notes ? `<div class="room-item-notes">${esc(r.notes)}</div>` : ''}
    </div>
  </li>`;
}

function noteItems(list, dotClass){
  if(!list || list.length===0) return '<div class="no-req">No requirements noted.</div>';
  return `<ul class="note-list">${list.map(n => `<li><span class="dot tab-dot ${dotClass}"></span><span>${esc(n)}</span></li>`).join('')}</ul>`;
}

function cateringPanel(list){
  if(!list || list.length===0) return '<div class="no-req">No requirements noted.</div>';
  return list.map(c => `
    <div class="catering-block">
      <div class="catering-block-head">
        <span><b>${esc(c.desc)}</b> &nbsp;&middot;&nbsp; ${esc(c.time)}</span>
        <span class="catering-tag">${esc(c.service)} &middot; ${esc(c.room)} &middot; Qty ${esc(c.qty)}</span>
      </div>
      ${c.notes && c.notes.length ? `<ul class="note-list">${c.notes.map(n=>`<li><span class="dot tab-dot dot-catering"></span><span>${esc(n)}</span></li>`).join('')}</ul>` : ''}
    </div>`).join('');
}

function badgesFor(e){
  let out = '';
  if(e.catering.length) out += '<span class="badge badge-catering">Catering</span>';
  if(e.estates.length) out += '<span class="badge badge-estates">Estates</span>';
  if(e.av.length) out += '<span class="badge badge-av">AV &amp; Tech</span>';
  if(e.other.length) out += '<span class="badge badge-other">Notes</span>';
  return out;
}

function cardHtml(e, idx){
  const uid = `ev_${idx}`;
  const roomsHtml = e.rooms.map(roomLine).join('');
  const generalNotes = e.overview && e.overview.length
    ? `<div class="subhead">General notes</div>${noteItems(e.overview,'dot-other')}`
    : '';

  const tabs = [
    {key:'overview', label:'Overview', has:true},
    {key:'catering', label:'Catering', has: e.catering.length>0},
    {key:'estates', label:'Estates &amp; Porters', has: e.estates.length>0},
    {key:'av', label:'AV &amp; Tech', has: e.av.length>0},
    {key:'other', label:'Other Notes', has: e.other.length>0},
  ];

  const tabBtns = tabs.map((t,i) => `
    <button class="tab-btn ${i===0?'active':''} ${t.has?'':'disabled'}"
      ${t.has ? `onclick="selectTab('${uid}','${t.key}')"` : ''}
      data-tab="${t.key}">${t.label}</button>`).join('');

  const overviewPanel = `
    <div class="kv-grid">
      <div class="kv"><span class="kv-label">Space</span><span class="kv-value">${esc(e.spaceHeadline)}${e.spaceSub ? ' — '+esc(e.spaceSub) : ''}</span></div>
      <div class="kv"><span class="kv-label">Numbers</span><span class="kv-value">${e.guests}</span></div>
      <div class="kv"><span class="kv-label">Reference</span><span class="kv-value">Ref ${esc(e.ref)}</span></div>
      <div class="kv"><span class="kv-label">Manager</span><span class="kv-value">${esc(e.manager)}</span></div>
      <div class="kv"><span class="kv-label">Status</span><span class="kv-value">${esc(e.status)}</span></div>
      <div class="kv"><span class="kv-label">Booking type</span><span class="kv-value">${esc(e.title)}</span></div>
    </div>
    <div class="subhead"><span class="chev"></span>Rooms &amp; layout</div>
    <ul class="room-list">${roomsHtml}</ul>
    ${generalNotes}
  `;

  return `
  <div class="card" id="${uid}">
    <div class="card-head" onclick="toggleCard('${uid}')">
      <div class="time-pill">${to12(e.start)}<span class="sep">to</span>${to12(e.end)}</div>
      <div class="card-title-wrap">
        <div class="card-title-row">
          <div class="card-title">${esc(e.title)}${e.status!=='Confirmed' ? `<span class="status-tag">${esc(e.status)}</span>` : ''}</div>
          <div class="card-ref">Ref ${esc(e.ref)}</div>
        </div>
        <div class="space-band">
          <span class="chev"></span>
          <span class="space-headline">${esc(e.spaceHeadline)}</span>
          ${e.spaceSub ? `<span class="space-sub">${esc(e.spaceSub)}</span>` : ''}
        </div>
        <div class="card-meta-row">
          <span><b>${esc(e.manager)}</b></span>
          <span>${e.guests} guests</span>
        </div>
        <div class="badges">${badgesFor(e)}</div>
      </div>
      <div class="card-expand-icon">&#9662;</div>
    </div>
    <div class="card-body">
      <div class="tabs">${tabBtns}</div>
      <div class="tab-panel active" data-panel="overview">${overviewPanel}</div>
      <div class="tab-panel" data-panel="catering">${cateringPanel(e.catering)}</div>
      <div class="tab-panel" data-panel="estates">${noteItems(e.estates,'dot-estates')}</div>
      <div class="tab-panel" data-panel="av">${noteItems(e.av,'dot-av')}</div>
      <div class="tab-panel" data-panel="other">${noteItems(e.other,'dot-other')}</div>
    </div>
  </div>`;
}

function renderPage(){
  const container = document.getElementById('pageContent');
  const list = eventsByDate[currentDate];
  if(!list || list.length===0){
    container.innerHTML = `<div class="empty-day">No bookings scheduled for this day.</div>`;
    return;
  }
  container.innerHTML = list.map((e,i) => cardHtml(e, currentDate+'_'+i)).join('');
}

function toggleCard(uid){
  const card = document.getElementById(uid);
  card.classList.toggle('open');
}

function selectTab(uid, tabKey){
  const card = document.getElementById(uid);
  card.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabKey));
  card.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tabKey));
  event.stopPropagation();
}

// Prevent tab clicks bubbling up to card toggle
document.addEventListener('click', e => {
  if(e.target.closest('.tabs')) e.stopPropagation();
});

renderWatermark();
renderWeekNav();
renderDayNav();
renderHeader();
updateWatermarkVisibility();
renderPage();
</script>
</body>
</html>
