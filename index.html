<style>
  :root{
    --navy:#2B3A8F;
    --navy-dark:#1a2460;
    --navy-mid:#3a4fa8;
    --navy-light:#eef0fa;
    --bg:#f2f3f8;
    --amber:#c77b14;
    --amber-bg:#fbeed7;
    --green:#2f7d4f;
    --green-bg:#dcefe2;
    --red:#b3322f;
    --red-bg:#f7dcdb;
    --ink:#22243a;
    --muted:#6a6f86;
    --line:#d8dcef;
    --radius:12px;
    --font:'Futura PT','Century Gothic',Futura,'Trebuchet MS',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header.app{
    position:sticky;top:0;z-index:50;
    background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 60%,var(--navy-mid) 100%);
    color:#fff;
    box-shadow:0 2px 10px rgba(15,20,60,.25);
  }
  .header-inner{
    max-width:1100px;margin:0 auto;
    padding:16px 22px;
    display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  }
  .brand{
    font-size:26px;font-weight:700;
    text-transform:uppercase;letter-spacing:.32em;
    white-space:nowrap;line-height:1;
  }
  .divider{
    width:2px;align-self:stretch;min-height:34px;
    background:rgba(255,255,255,.32);
  }
  .header-meta{display:flex;flex-direction:column;gap:2px;}
  .header-meta .wk{font-size:15px;font-weight:600;letter-spacing:.04em;}
  .header-meta .rng{font-size:13px;color:#c7cdef;letter-spacing:.02em;}
  .header-meta .iuo{
    font-size:11px;text-transform:uppercase;letter-spacing:.18em;
    color:#9aa3d8;margin-top:2px;
  }

  /* ---------- Day nav ---------- */
  nav.days{
    position:sticky;top:0;z-index:40;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 1px 4px rgba(20,30,80,.06);
  }
  .days-inner{
    max-width:1100px;margin:0 auto;
    display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .days-inner::-webkit-scrollbar{display:none;}
  .daytab{
    flex:1 0 auto;min-width:84px;
    border:none;background:transparent;cursor:pointer;
    padding:10px 14px 9px;
    font-family:var(--font);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--muted);border-bottom:3px solid transparent;
    transition:background .15s,color .15s;
  }
  .daytab:hover{background:var(--navy-light);}
  .daytab .dn{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;}
  .daytab .dd{font-size:21px;font-weight:700;line-height:1;color:var(--ink);}
  .daytab .dc{
    font-size:10.5px;letter-spacing:.02em;
    background:var(--navy-light);color:var(--navy);
    padding:1px 7px;border-radius:9px;font-weight:600;
  }
  .daytab.active{color:var(--navy);border-bottom-color:var(--navy);}
  .daytab.active .dc{background:var(--navy);color:#fff;}

  /* ---------- Main ---------- */
  main{max-width:1100px;margin:0 auto;padding:22px 18px 60px;}
  .day-head{
    display:flex;align-items:baseline;gap:12px;
    margin:6px 2px 16px;flex-wrap:wrap;
  }
  .day-head h2{font-size:19px;margin:0;letter-spacing:.01em;}
  .day-head .count{font-size:13px;color:var(--muted);}

  /* ---------- Cards ---------- */
  .card{
    background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:12px;
    overflow:hidden;transition:border-color .15s,box-shadow .15s;
  }
  .card:hover{border-color:#b9c0e6;box-shadow:0 3px 12px rgba(30,40,100,.07);}
  .card.open{border-color:var(--navy);box-shadow:0 4px 16px rgba(30,40,100,.12);}
  .card-head{
    display:flex;align-items:flex-start;gap:14px;
    padding:14px 16px;cursor:pointer;user-select:none;
  }
  .timepill{
    flex:0 0 auto;background:var(--navy);color:#fff;
    border-radius:8px;padding:7px 11px;text-align:center;
    min-width:78px;line-height:1.25;
  }
  .timepill .t1{font-size:14px;font-weight:700;letter-spacing:.02em;}
  .timepill .t2{font-size:11px;color:#c2c9ee;}
  .card-body-head{flex:1 1 auto;min-width:0;}
  .card-title{font-size:16px;font-weight:700;margin:1px 0 4px;letter-spacing:.005em;}
  .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:7px;}
  .card-sub .num{color:var(--navy);font-weight:600;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{
    font-size:10.5px;font-weight:700;text-transform:uppercase;
    letter-spacing:.08em;padding:3px 8px;border-radius:20px;
  }
  .b-cat{background:var(--amber-bg);color:var(--amber);}
  .b-est{background:var(--navy-light);color:var(--navy);}
  .b-av{background:var(--green-bg);color:var(--green);}
  .b-note{background:var(--red-bg);color:var(--red);}
  .chev{
    flex:0 0 auto;align-self:center;color:var(--muted);
    transition:transform .2s;font-size:18px;
  }
  .card.open .chev{transform:rotate(180deg);color:var(--navy);}

  /* ---------- Expanded ---------- */
  .card-detail{display:none;border-top:1px solid var(--line);}
  .card.open .card-detail{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .tabrow{
    display:flex;overflow-x:auto;background:var(--navy-light);
    border-bottom:1px solid var(--line);scrollbar-width:none;
  }
  .tabrow::-webkit-scrollbar{display:none;}
  .tabbtn{
    flex:0 0 auto;border:none;background:transparent;cursor:pointer;
    font-family:var(--font);font-size:12.5px;font-weight:600;
    padding:11px 15px;color:var(--navy);
    border-bottom:3px solid transparent;white-space:nowrap;
    transition:background .12s;
  }
  .tabbtn:hover:not(.disabled){background:#e0e4f6;}
  .tabbtn.active{background:#fff;border-bottom-color:var(--navy);}
  .tabbtn.disabled{color:#b2b6c9;cursor:not-allowed;}
  .tabpane{display:none;padding:16px 18px 20px;}
  .tabpane.active{display:block;}

  /* Overview grid */
  .ovgrid{
    display:grid;grid-template-columns:auto 1fr;gap:8px 18px;
    font-size:13.5px;
  }
  .ovgrid dt{color:var(--muted);font-weight:600;}
  .ovgrid dd{margin:0;color:var(--ink);}
  .ovgrid dd .pill{
    display:inline-block;background:var(--navy-light);color:var(--navy);
    border-radius:6px;padding:1px 8px;font-size:11.5px;font-weight:600;
    margin:0 4px 4px 0;
  }
  .status-confirmed{color:var(--green);font-weight:700;}
  .status-other{color:var(--amber);font-weight:700;}
  .ov-note{
    grid-column:1 / -1;margin-top:6px;padding-top:10px;
    border-top:1px dashed var(--line);color:var(--ink);font-size:13px;
  }

  /* requirement lists */
  ul.reqs{margin:0;padding:0;list-style:none;}
  ul.reqs li{
    position:relative;padding:5px 0 5px 18px;font-size:13.5px;
    border-bottom:1px solid #f0f1f7;
  }
  ul.reqs li:last-child{border-bottom:none;}
  ul.reqs li::before{
    content:"";position:absolute;left:2px;top:11px;
    width:6px;height:6px;border-radius:50%;background:var(--navy-mid);
  }
  ul.reqs li .lbl{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);font-weight:700;display:block;margin-bottom:1px;
  }
  .empty{color:var(--muted);font-style:italic;font-size:13.5px;padding:4px 0;}

  /* ---------- Footer ---------- */
  footer.app{
    background:var(--navy-dark);color:#aab2e0;
    text-align:center;padding:18px;
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  }

  @media (max-width:620px){
    .header-inner{gap:14px;padding:12px 16px;}
    .brand{font-size:19px;letter-spacing:.22em;}
    .divider{min-height:28px;}
    .header-meta .wk{font-size:13px;}
    .daytab{min-width:64px;padding:8px 8px 7px;}
    .daytab .dd{font-size:18px;}
    main{padding:16px 12px 50px;}
    .card-head{gap:10px;padding:12px;}
    .timepill{min-width:66px;padding:6px 8px;}
    .timepill .t1{font-size:13px;}
    .card-title{font-size:14.5px;}
    .ovgrid{grid-template-columns:1fr;gap:3px 0;}
    .ovgrid dt{margin-top:7px;}
  }
</style>

/* ============================================================
   RENDER
   ============================================================ */
const TABS = [
  {key:"overview", label:"Overview"},
  {key:"catering", label:"Catering"},
  {key:"estates",  label:"Estates & Porters"},
  {key:"av",       label:"AV & Tech"},
  {key:"other",    label:"Other Notes"}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildBadges(ev){
  let b='';
  if(ev.catering && ev.catering.length) b+='<span class="badge b-cat">Catering</span>';
  if(ev.estates && ev.estates.length)   b+='<span class="badge b-est">Estates</span>';
  if(ev.av && ev.av.length)             b+='<span class="badge b-av">AV</span>';
  if(ev.other && ev.other.length)       b+='<span class="badge b-note">Notes</span>';
  return b;
}

function reqList(arr){
  if(!arr || !arr.length) return '<p class="empty">No requirements noted.</p>';
  return '<ul class="reqs">'+arr.map(r=>
    '<li><span class="lbl">'+esc(r.lbl)+'</span>'+esc(r.text)+'</li>'
  ).join('')+'</ul>';
}

function overviewPane(ev){
  const statusClass = ev.status==='Confirmed' ? 'status-confirmed' : 'status-other';
  const rooms = (ev.rooms&&ev.rooms.length)
    ? ev.rooms.map(r=>'<span class="pill">'+esc(r)+'</span>').join('')
    : '<span class="pill">Not specified</span>';
  let html='<dl class="ovgrid">';
  html+='<dt>Room(s)</dt><dd>'+rooms+'</dd>';
  html+='<dt>Numbers</dt><dd>'+esc(ev.numbers)+'</dd>';
  html+='<dt>Reference</dt><dd>'+esc(ev.ref)+'</dd>';
  html+='<dt>Manager</dt><dd>'+esc(ev.manager)+'</dd>';
  html+='<dt>Type</dt><dd>'+esc(ev.type)+'</dd>';
  html+='<dt>Status</dt><dd class="'+statusClass+'">'+esc(ev.status)+'</dd>';
  if(ev.note) html+='<div class="ov-note">'+esc(ev.note)+'</div>';
  html+='</dl>';
  return html;
}

function buildCard(ev, dayIdx, evIdx){
  const id='c'+dayIdx+'_'+evIdx;
  const panes = {
    overview: overviewPane(ev),
    catering: reqList(ev.catering),
    estates:  reqList(ev.estates),
    av:       reqList(ev.av),
    other:    reqList(ev.other)
  };
  const hasContent = {
    overview:true,
    catering:!!(ev.catering&&ev.catering.length),
    estates:!!(ev.estates&&ev.estates.length),
    av:!!(ev.av&&ev.av.length),
    other:!!(ev.other&&ev.other.length)
  };

  let tabBtns='', tabPanes='';
  TABS.forEach((t,i)=>{
    const enabled = hasContent[t.key];
    const activeOv = (t.key==='overview');
    tabBtns += '<button class="tabbtn'+(activeOv?' active':'')+(enabled?'':' disabled')+'" '
      + (enabled?('data-tab="'+id+'_'+t.key+'"'):'disabled')
      + '>'+esc(t.label)+'</button>';
    tabPanes += '<div class="tabpane'+(activeOv?' active':'')+'" id="'+id+'_'+t.key+'">'+panes[t.key]+'</div>';
  });

  return ''
  + '<article class="card" id="'+id+'">'
  +   '<div class="card-head" data-card="'+id+'">'
  +     '<div class="timepill"><div class="t1">'+esc(ev.start)+'</div><div class="t2">'+esc(ev.end)+'</div></div>'
  +     '<div class="card-body-head">'
  +       '<div class="card-title">'+esc(ev.title)+'</div>'
  +       '<div class="card-sub">'+esc(ev.manager)+' · Ref '+esc(ev.ref)+' · <span class="num">'+esc(ev.numbers)+' pax</span></div>'
  +       '<div class="badges">'+buildBadges(ev)+'</div>'
  +     '</div>'
  +     '<div class="chev">&#9662;</div>'
  +   '</div>'
  +   '<div class="card-detail">'
  +     '<div class="tabrow">'+tabBtns+'</div>'
  +     tabPanes
  +   '</div>'
  + '</article>';
}

/* Build day nav */
const nav=document.getElementById('dayNav');
DATA.forEach((d,i)=>{
  const btn=document.createElement('button');
  btn.className='daytab'+(i===0?' active':'');
  btn.dataset.day=i;
  btn.innerHTML='<span class="dn">'+d.name+'</span><span class="dd">'+d.date+'</span>'
    +'<span class="dc">'+d.events.length+'</span>';
  nav.appendChild(btn);
});

/* Build all day sections (one visible at a time) */
const main=document.getElementById('main');
DATA.forEach((d,i)=>{
  const sorted=[...d.events].sort((a,b)=>a.start.localeCompare(b.start));
  const sec=document.createElement('section');
  sec.className='day-section';
  sec.dataset.day=i;
  sec.style.display = i===0 ? 'block':'none';
  let html='<div class="day-head"><h2>'+esc(d.full)+'</h2>'
    +'<span class="count">'+d.events.length+' event'+(d.events.length===1?'':'s')+'</span></div>';
  html+=sorted.map((ev,j)=>buildCard(ev,i,j)).join('');
  sec.innerHTML=html;
  main.appendChild(sec);
});

/* Day switching */
nav.addEventListener('click',e=>{
  const t=e.target.closest('.daytab'); if(!t) return;
  const idx=t.dataset.day;
  document.querySelectorAll('.daytab').forEach(x=>x.classList.toggle('active',x.dataset.day===idx));
  document.querySelectorAll('.day-section').forEach(x=>x.style.display = x.dataset.day===idx?'block':'none');
  window.scrollTo({top:0,behavior:'smooth'});
});

/* Card expand + tab switching (delegated) */
main.addEventListener('click',e=>{
  const head=e.target.closest('.card-head');
  if(head){
    const card=document.getElementById(head.dataset.card);
    card.classList.toggle('open');
    return;
  }
  const tab=e.target.closest('.tabbtn');
  if(tab && !tab.classList.contains('disabled')){
    const targetId=tab.dataset.tab;
    const tabrow=tab.closest('.tabrow');
    const detail=tab.closest('.card-detail');
    tabrow.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('active'));
    tab.classList.add('active');
    detail.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    detail.querySelector('#'+targetId).classList.add('active');
  }
});
</script>
