<style>
  :root{
    --cf:#6495ED; --cf-dark:#2F4FB0; --cf-mid:#5680E0; --cf-light:#EAF0FC;
    --cf-border:#D6E0FA; --estates:#3A5FBF;
    --amber:#C77A0A; --amber-bg:#FBEFD9;
    --green:#2E7D4F; --green-bg:#DDF0E4;
    --red:#C0392B; --red-bg:#FBE3E0;
    --estates-bg:#E2E9FB;
    --bg:#f2f3f8; --ink:#1d2433; --muted:#5b667c;
    --font:'Futura PT','Century Gothic',Futura,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(100deg,var(--cf-dark) 0%,var(--cf-mid) 100%);
    color:#fff;padding:14px 20px;
    box-shadow:0 2px 14px rgba(47,79,176,.28);
  }
  .head-inner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
  .wordmark{font-size:26px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
  .vdiv{width:1px;align-self:stretch;min-height:30px;background:rgba(255,255,255,.45)}
  .head-meta{display:flex;flex-direction:column;gap:1px;font-weight:400}
  .head-week{font-size:14px;font-weight:700;letter-spacing:.04em}
  .head-range{font-size:12.5px;opacity:.92}
  .head-internal{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.78;margin-top:2px}

  /* ---------- Day nav ---------- */
  .daynav{
    position:sticky;top:64px;z-index:35;background:#fff;
    border-bottom:1px solid var(--cf-border);
    box-shadow:0 1px 6px rgba(47,79,176,.06);
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .daynav-inner{display:flex;gap:0;max-width:1180px;margin:0 auto;min-width:max-content}
  .daytab{
    flex:1 0 auto;min-width:104px;border:none;background:transparent;cursor:pointer;
    font-family:var(--font);padding:9px 14px 8px;text-align:center;
    border-bottom:3px solid transparent;color:var(--muted);transition:all .15s;
  }
  .daytab:hover{background:var(--cf-light)}
  .daytab .dname{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
  .daytab .dnum{font-size:20px;font-weight:700;line-height:1.1;color:var(--ink)}
  .daytab .dcount{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .daytab.active{border-bottom-color:var(--cf-dark);background:var(--cf-light)}
  .daytab.active .dname,.daytab.active .dnum{color:var(--cf-dark)}
  .daytab:focus-visible{outline:2px solid var(--cf-dark);outline-offset:-2px}

  /* ---------- Main ---------- */
  main{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
  .day-head{display:flex;align-items:baseline;gap:12px;margin:6px 2px 16px;flex-wrap:wrap}
  .day-head h2{font-size:21px;font-weight:700;letter-spacing:.01em}
  .day-head .dh-count{font-size:13px;color:var(--muted)}
  .day-head .dh-line{flex:1;height:1px;background:var(--cf-border);min-width:24px}

  .cards{display:flex;flex-direction:column;gap:11px}

  /* ---------- Card ---------- */
  .card{
    background:#fff;border:1px solid var(--cf-border);border-radius:11px;
    overflow:hidden;transition:box-shadow .15s,border-color .15s;
  }
  .card:hover{box-shadow:0 4px 16px rgba(47,79,176,.1);border-color:var(--cf-mid)}
  .card.open{box-shadow:0 6px 22px rgba(47,79,176,.14);border-color:var(--cf-mid)}
  .card-head{
    display:flex;align-items:flex-start;gap:13px;padding:13px 15px;cursor:pointer;
    width:100%;border:none;background:transparent;font-family:var(--font);text-align:left;
  }
  .card-head:focus-visible{outline:2px solid var(--cf-dark);outline-offset:-3px}
  .timepill{
    flex-shrink:0;background:var(--cf-dark);color:#fff;border-radius:7px;
    padding:6px 9px;text-align:center;min-width:74px;
  }
  .timepill .t1{font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1.15}
  .timepill .t2{font-size:11px;opacity:.82;line-height:1.2}
  .card-main{flex:1;min-width:0}
  .card-title{font-size:15.5px;font-weight:700;line-height:1.25;color:var(--ink)}
  .card-sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card-sub .mgr{font-weight:700;color:var(--cf-dark)}
  .card-sub .rm{color:var(--muted)}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
  .b-cat{background:var(--amber-bg);color:var(--amber)}
  .b-est{background:var(--estates-bg);color:var(--estates)}
  .b-av{background:var(--green-bg);color:var(--green)}
  .b-note{background:var(--red-bg);color:var(--red)}
  .b-status{background:var(--cf-light);color:var(--cf-dark);border:1px solid var(--cf-border)}
  .b-status.prov{background:#FFF7E6;color:#9A6700;border-color:#F2E2BC}
  .chev{flex-shrink:0;color:var(--cf-mid);font-size:13px;margin-top:4px;transition:transform .2s}
  .card.open .chev{transform:rotate(180deg)}

  /* ---------- Expanded body ---------- */
  .card-body{display:none;border-top:1px solid var(--cf-border)}
  .card.open .card-body{display:block}
  .tabbar{display:flex;gap:2px;padding:9px 12px 0;background:var(--cf-light);flex-wrap:wrap;border-bottom:1px solid var(--cf-border)}
  .tab{
    font-family:var(--font);font-size:12px;font-weight:700;letter-spacing:.02em;
    padding:7px 12px;border:none;background:transparent;cursor:pointer;color:var(--muted);
    border-radius:7px 7px 0 0;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all .12s;
  }
  .tab:hover:not(.disabled){background:#fff;color:var(--cf-dark)}
  .tab.active{background:#fff;color:var(--cf-dark);border-bottom-color:var(--cf-dark)}
  .tab.disabled{color:#b9c0cf;cursor:not-allowed;opacity:.6}
  .tab:focus-visible{outline:2px solid var(--cf-dark);outline-offset:-2px}
  .tabpanel{display:none;padding:15px 17px 18px}
  .tabpanel.active{display:block}

  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px 22px}
  .kv .kv-item{display:flex;flex-direction:column;gap:1px}
  .kv .kv-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kv .kv-v{font-size:13.5px;color:var(--ink);font-weight:400}
  .kv .kv-v.full{grid-column:1/-1}
  .ov-notes{margin-top:14px;padding-top:13px;border-top:1px dashed var(--cf-border)}
  .ov-notes .kv-k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
  .ov-notes p{font-size:13.5px;color:var(--ink)}

  ul.reqs{list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.reqs li{position:relative;padding-left:18px;font-size:13.5px;color:var(--ink)}
  ul.reqs li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--cf-mid)}
  ul.reqs li.sub{padding-left:34px;color:var(--muted);font-size:12.5px}
  ul.reqs li.sub::before{left:18px;top:8px;width:4px;height:4px;background:var(--cf-border)}
  .req-empty{font-size:13px;color:var(--muted);font-style:italic}
  .req-label{font-weight:700;color:var(--estates)}
  .tab-cat .req-label{color:var(--amber)}
  .tab-av .req-label{color:var(--green)}
  .tab-other .req-label{color:var(--red)}

  /* ---------- Footer ---------- */
  footer{background:var(--cf-dark);color:#fff;text-align:center;padding:18px 20px;font-size:12px;letter-spacing:.08em}
  footer span{opacity:.9}

  .empty-day{background:#fff;border:1px dashed var(--cf-border);border-radius:11px;padding:34px 20px;text-align:center;color:var(--muted);font-size:14px}

  @media (max-width:560px){
    .wordmark{font-size:20px;letter-spacing:.13em}
    .vdiv{display:none}
    .head-inner{gap:10px}
    .daynav{top:58px}
    .timepill{min-width:64px}
    .card-title{font-size:14.5px}
    .kv{grid-template-columns:1fr}
    main{padding:14px 11px 40px}
  }
</style>
</head>

/* ===== Render ===== */
function countFor(dayKey){return EVENTS.filter(e=>e.day===dayKey).length;}

function buildNav(){
  const nav=document.getElementById('daynav');
  DAYS.forEach((d,i)=>{
    const c=countFor(d.key);
    const b=document.createElement('button');
    b.className='daytab'+(i===0?' active':'');
    b.dataset.day=d.key;
    b.innerHTML=`<div class="dname">${d.name}</div><div class="dnum">${d.num}</div><div class="dcount">${c} event${c===1?'':'s'}</div>`;
    b.addEventListener('click',()=>showDay(d.key));
    nav.appendChild(b);
  });
}

function tabBtn(label,cls,has,key){
  const dis=has?'':' disabled';
  return `<button class="tab${dis}" data-tab="${key}" ${has?'':'disabled aria-disabled="true"'}>${label}</button>`;
}
function reqList(items){
  if(!items||!items.length) return `<p class="req-empty">No requirements noted.</p>`;
  let html='<ul class="reqs">';
  items.forEach(it=>{
    if(typeof it==='object'&&it.sub){html+=`<li class="sub">${it.t}</li>`;}
    else{html+=`<li>${it}</li>`;}
  });
  return html+'</ul>';
}

function cardHTML(e,idx){
  const hasCat=!!(e.catering&&e.catering.length);
  const hasEst=!!(e.estates&&e.estates.length);
  const hasAV=!!(e.av&&e.av.length);
  const hasOth=!!(e.other&&e.other.length);
  const prov = e.status!=='Confirmed';
  const badges=[
    `<span class="badge b-status${prov?' prov':''}">${e.status}</span>`,
    hasCat?'<span class="badge b-cat">Catering</span>':'',
    hasEst?'<span class="badge b-est">Estates</span>':'',
    hasAV?'<span class="badge b-av">AV</span>':'',
    hasOth?'<span class="badge b-note">Notes</span>':'',
  ].join('');
  const [t1,t2]=e.time.split('–');

  const ov=`<div class="kv">
    <div class="kv-item"><span class="kv-k">Room</span><span class="kv-v full">${e.room||'—'}</span></div>
    <div class="kv-item"><span class="kv-k">Numbers</span><span class="kv-v">${e.num}</span></div>
    <div class="kv-item"><span class="kv-k">Ref</span><span class="kv-v">#${e.ref}</span></div>
    <div class="kv-item"><span class="kv-k">Manager</span><span class="kv-v">${e.mgr}</span></div>
    <div class="kv-item"><span class="kv-k">Status</span><span class="kv-v">${e.status}</span></div>
    <div class="kv-item"><span class="kv-k">Type</span><span class="kv-v">${e.type}</span></div>
    <div class="kv-item"><span class="kv-k">Time</span><span class="kv-v">${e.time}</span></div>
  </div>${e.notes?`<div class="ov-notes"><div class="kv-k">Notes</div><p>${e.notes}</p></div>`:''}`;

  return `<div class="card" data-idx="${idx}">
    <button class="card-head" aria-expanded="false">
      <div class="timepill"><div class="t1">${t1}</div><div class="t2">${t2}</div></div>
      <div class="card-main">
        <div class="card-title">${e.title}</div>
        <div class="card-sub"><span class="mgr">${e.mgr}</span><span class="rm">${e.room||''}</span></div>
        <div class="badges">${badges}</div>
      </div>
      <div class="chev" aria-hidden="true">▾</div>
    </button>
    <div class="card-body">
      <div class="tabbar" role="tablist">
        ${tabBtn('Overview','',true,'ov')}
        ${tabBtn('Catering','tab-cat',hasCat,'cat')}
        ${tabBtn('Estates & Porters','tab-est',hasEst,'est')}
        ${tabBtn('AV & Tech','tab-av',hasAV,'av')}
        ${tabBtn('Other Notes','tab-other',hasOth,'oth')}
      </div>
      <div class="tabpanel active" data-panel="ov">${ov}</div>
      <div class="tabpanel tab-cat" data-panel="cat">${reqList(e.catering)}</div>
      <div class="tabpanel tab-est" data-panel="est">${reqList(e.estates)}</div>
      <div class="tabpanel tab-av" data-panel="av">${reqList(e.av)}</div>
      <div class="tabpanel tab-other" data-panel="oth">${reqList(e.other)}</div>
    </div>
  </div>`;
}

function showDay(key){
  document.querySelectorAll('.daytab').forEach(t=>t.classList.toggle('active',t.dataset.day===key));
  const day=DAYS.find(d=>d.key===key);
  const evs=EVENTS.filter(e=>e.day===key);
  const main=document.getElementById('main');
  let html=`<div class="day-head"><h2>${day.label}</h2><span class="dh-count">${evs.length} event${evs.length===1?'':'s'}</span><span class="dh-line"></span></div>`;
  if(!evs.length){html+=`<div class="empty-day">No events scheduled for this day.</div>`;}
  else{html+='<div class="cards">'+evs.map((e,i)=>cardHTML(e,i)).join('')+'</div>';}
  main.innerHTML=html;
  wireCards();
  window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}

function wireCards(){
  document.querySelectorAll('.card').forEach(card=>{
    const head=card.querySelector('.card-head');
    head.addEventListener('click',()=>{
      const open=card.classList.toggle('open');
      head.setAttribute('aria-expanded',open?'true':'false');
    });
    card.querySelectorAll('.tab:not(.disabled)').forEach(tab=>{
      tab.addEventListener('click',ev=>{
        ev.stopPropagation();
        const panel=tab.dataset.tab;
        card.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        card.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        card.querySelector(`.tabpanel[data-panel="${panel}"]`).classList.add('active');
      });
    });
  });
}

buildNav();
showDay('mon');
</script>
</body>
</html>
